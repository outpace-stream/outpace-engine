name: site

# The documentation website at https://outpace-stream.github.io/outpace-engine/
# is built from docs/wiki/, the same source as the GitHub wiki (wiki.yml), by
# tools/site/build.py with mdBook. Pull requests build it in strict mode and
# upload nothing; merges to main build and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "docs/assets/social-preview.png"
      - "tools/site/**"
      - "tools/wiki/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "docs/wiki/**"
      - "docs/assets/social-preview.png"
      - "tools/site/**"
      - "tools/wiki/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# Build and deploy share one group per ref, so a whole run (build, then deploy)
# finishes before the next starts. GitHub keeps only the newest pending run in a
# group, so an older commit can never deploy after a newer one. On main a running
# deployment is never cancelled half-way; superseded pull request builds are.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Site tooling only; nothing here ships in Outpace. Bump both together.
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: build site
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mdbook"
          echo "MDBOOK=$RUNNER_TEMP/mdbook/mdbook" >> "$GITHUB_ENV"
      - name: Test the site build script
        run: python3 -m unittest discover -s tools/site -v
      - name: Build the site from docs/wiki
        run: python3 tools/site/build.py --strict --out _site
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The concurrency group serializes runs but admits them in the order they start
      # waiting, not commit order. If main has moved on, deploy anyway when no newer
      # commit touches the site's inputs (the build would be identical, and the path
      # filter starts no newer run); skip only when a newer commit does, since that
      # commit's own run publishes the newer docs. Keep SITE_PATHS in sync with `on:`.
      - name: Skip a superseded commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_PATHS: "^(docs/wiki/|tools/site/|tools/wiki/|docs/assets/social-preview\\.png$|\\.github/workflows/site\\.yml$)"
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          deploy=true
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${tip}")"
            status="$(jq -r .status <<<"$compare")"
            changed="$(jq -r '.files[]?.filename' <<<"$compare" | grep -E "$SITE_PATHS" || true)"
            # The compare API lists at most 300 files; a longer list counts as changed.
            if [[ "$status" != "ahead" || -n "$changed" ]] \
                || (( $(jq '.files | length' <<<"$compare") >= 300 )); then
              deploy=false
              echo "::notice::main moved to ${tip} with site changes; its run deploys instead."
            fi
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
